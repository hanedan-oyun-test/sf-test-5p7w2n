R.L = { W, H, port, title, small, scene, panel, hudH, orderH, street, bench, bays, railY: bench.y + bench.h - 14 - 7, logoY: Math.round(H * (port ? 0.27 : 0.25)), cashPos: { x: 60, y: 24 } };
px($('scene'), { left: scene.x, top: scene.y, width: scene.w, height: scene.h });
px($('turbo'), { top: hudH + 6 });
px($('prestige'), { top: street.y + street.h - 48 });
px($('orderBar'), { top: scene.h - orderH + 3, height: orderH - 8 });
const logoW = R.L.logoW = Math.min(W * 0.84, 560, H * 1.05); $('tsp').style.height = Math.round(R.L.logoY + logoW * 0.08 + (port ? 46 : 26)) + 'px';
bakeStatic();
const cr = $('cash').getBoundingClientRect(); if (cr.width) R.L.cashPos = { x: cr.left + cr.width / 2, y: cr.top + cr.height / 2 };
}
function startPlay() {
if (playing) return;
AU.unlock(); AU.click(); playing = true; document.body.classList.remove('title'); layout(); UI.update(true);
if (offlinePending) { const o = offlinePending; offlinePending = null; UI.offline(o); }
saveGame();
}
CV.addEventListener('pointerdown', e => {
if (!playing || paused || !$('modal').hidden) return;
AU.unlock();
const L = R.L, x = e.clientX, y = e.clientY, B = L.bench;
if (y >= B.y - 4 && y <= B.y + B.h + 4 && x >= L.scene.x && x <= L.scene.x + L.scene.w) {
let k = 0, best = 1e9; L.bays.forEach((b, i) => { const d = Math.abs(b.cx - x); if (d < best) { best = d; k = i; } });
tapStation(k);
} else if (y >= L.street.y && y < L.street.y + L.street.h && R.shops) {
const i = R.shops.findIndex(s => x >= s.x && x <= s.x + s.w);
if (i >= 0 && G.s.lit[i] && R.shopVis[i] && R.shopVis[i].litAt !== null && R.shopVis[i].litAt <= G.time) { R.shopVis[i].litAt = G.time; AU.buzz(); spark(R.shops[i].cx, R.shops[i].cy, 10, VENUES[RECIPES[shops()[i]].id].c, 0.6); }
}
});
['gesturestart', 'dblclick', 'contextmenu'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
document.addEventListener('touchmove', e => { if (!e.target.closest('#list')) e.preventDefault(); }, { passive: false });
function handleEvents() {
const L = R.L;
while (G.ev.length) {
const e = G.ev.shift();
if (e.type === 'stage') { if (e.k === 0) AU.spark(); else if (e.k === 1) AU.hiss(); else AU.spark(true); }
else if (e.type === 'turbo') { const b = L.bays[e.k]; spark(b.cx, b.cy, 12, '#FFA640', 1.1); R.tapFx = R.tapFx || [0, 0, 0]; R.tapFx[e.k] = 1; AU.spark(true); }
else if (e.type === 'done') {
const b = L.bays[2]; coins(b.cx, b.cy, Math.min(10, 4 + Math.floor(Math.log10(e.v + 1) * 2))); floatText(b.cx, b.cy - b.size * 0.3, '+' + fmt(e.v), GASES[e.g].c === '#00F0FF' ? '#BFFBFF' : GASES[e.g].c);
ring(b.cx, b.cy, GASES[e.g].c, b.size * 0.5); AU.ignite();
if (G.s.forged === 1) R.flash = 0.8;
if (e.shopLit >= 0 && R.shops) {
const i = e.shopLit, sh = R.shops[i], id = RECIPES[e.r].id, col = VENUES[id].c;
R.shopVis[i] = { litAt: Infinity };
R.fly.push({ id, col, x0: b.cx, y0: b.cy, s0: b.size, x1: sh.cx, y1: sh.cy, s1: sh.size, t: 0, dur: 0.85, shop: i, done: () => { AU.chord(); spark(sh.cx, sh.cy, 26, col, 0.9); ring(sh.cx, sh.cy, col, sh.size); R.flash = 0.4; } });
} else if (e.orderDone) AU.chord();
UI.update(true);
} else if (e.type === 'buy') { R.flash = 0.15; UI.update(true); }
else if (e.type === 'select') UI.update(true);
else if (e.type === 'prestige') { bakeStatic(); syncShopVis(); AU.swell(); R.flash = 1; UI.update(true); }
}
}
function frame(ts) {
const now = ts / 1000, dt = Math.min(0.05, Math.max(0, lastT ? now - lastT : 0.016)); lastT = now;
if (playing && !paused) step(dt);
handleEvents();
stepParticles(dt);
renderFrame(now, dt);
if (!firstFrame) { firstFrame = performance.now(); window.__sf.firstFrame = firstFrame; }
uiT += dt; if (uiT > 0.15) { uiT = 0; UI.update(); }
if (playing) { saveT += dt; if (saveT > 5) { saveT = 0; saveGame(); } }
requestAnimationFrame(frame);
}
AU.init();
offlinePending = loadGame();
syncShopVis();
R.coinCb = () => { bumpCash(); AU.coin(); };
UI.init();
layout();
$('play').addEventListener('click', startPlay);
addEventListener('resize', () => { layout(); UI.update(true); });
document.addEventListener('visibilitychange', () => { if (document.hidden && playing) saveGame(); });
addEventListener('pagehide', () => { if (playing) saveGame(); });
window.__sf = {
firstFrame: 0, t0: T0,
state: () => ({ cash: G.s.cash, auto: G.s.auto, lv: G.s.lv.slice(), rec: G.s.rec.slice(), gas: G.s.gas.slice(), ri: G.s.ri, gi: G.s.gi, lit: G.s.lit.slice(), oi: G.s.oi, op: G.s.op,
pending: G.s.pending, district: G.s.district, mult: distMult(), adTurbo: G.s.adTurbo, forged: G.s.forged, heat: G.heat, st: G.st.map(s => s.item ? s.p : -1), playing, paused,
order: currentOrder(), rate: incomeRate(), lang: LANG, muted: AU.muted, canPrestige: canPrestige() }),
sim(sec) { const n = Math.round(sec * 60); for (let i = 0; i < n; i++) { step(1 / 60); if (i % 30 === 0) handleEvents(); } handleEvents(); UI.update(true); },
give(n) { G.s.cash += n; UI.update(true); },
save: () => saveGame(),
age(sec) { const d = JSON.parse(localStorage.getItem(SAVE_KEY)); d.savedAt -= sec * 1000; localStorage.setItem(SAVE_KEY, JSON.stringify(d)); G.noSave = true; },
layout: () => R.L, shops: () => R.shops
};
requestAnimationFrame(frame);
})();
